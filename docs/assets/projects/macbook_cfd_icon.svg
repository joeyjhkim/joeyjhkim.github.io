<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- MacBook chassis top-down -->
  <rect x="14" y="28" width="92" height="56" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <!-- Vapor chamber strip -->
  <rect x="28" y="34" width="64" height="6" fill="#4b5563" opacity="0.7"/>
  <!-- SoC hot spot -->
  <rect x="52" y="48" width="16" height="14" fill="url(#hot)"/>
  <!-- Fans -->
  <circle cx="32" cy="58" r="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.2"/>
  <circle cx="88" cy="58" r="8" fill="#1f2937" stroke="#6b7280" stroke-width="1.2"/>
  <!-- Fan blades -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <path d="M 32 50 Q 38 54 32 58 Q 26 62 32 66"/>
    <path d="M 88 50 Q 94 54 88 58 Q 82 62 88 66"/>
  </g>
  <!-- Airflow arrows -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 14 92 L 60 92" marker-end="url(#ar)"/>
    <path d="M 20 78 Q 40 72 56 70"/>
    <path d="M 100 78 Q 80 72 64 70"/>
  </g>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <!-- Exhaust bars top -->
  <rect x="30" y="24" width="18" height="2" fill="#f87171"/>
  <rect x="72" y="24" width="18" height="2" fill="#f87171"/>
  <!-- Label -->
  <text x="60" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#e5e7eb" font-weight="600">CFD</text>
</svg>
